name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tags must be vX.Y.Z without a prerelease suffix.'
          }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ($package.version -ne $version -or $tauri.version -ne $version -or $cargo -ne $version) {
            throw 'The tag, package.json, Cargo.toml and tauri.conf.json versions must match.'
          }
      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $heading = "## $env:GITHUB_REF_NAME"
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, $heading)
          if ($start -lt 0) { throw "CHANGELOG.md has no '$heading' section." }
          $section = $lines[($start + 1)..($lines.Count - 1)]
          $end = [array]::FindIndex([string[]]$section, [Predicate[string]] { param($line) $line.StartsWith('## ') })
          if ($end -ge 0) { $section = $section[0..($end - 1)] }
          $notes = ($section -join "`n").Trim()
          if (-not $notes) { throw "CHANGELOG.md's '$heading' section is empty." }
          $body = "$notes`n`nTo install and check the download, see the [README](https://github.com/$env:GITHUB_REPOSITORY#installation)."
          "body<<NOTES_END`n$body`nNOTES_END" >> $env:GITHUB_OUTPUT
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install notices generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Stays a draft until every asset is attached, so `latest` never points at a partial release.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: -- --locked
      - name: Publish installer checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows NSIS installer.' }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = $installer.FullName + '.sha256'
          [IO.File]::WriteAllText($checksum, "$hash  $($installer.Name)`n", [Text.UTF8Encoding]::new($false))
          gh release upload $env:GITHUB_REF_NAME $checksum --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Checksum upload failed.' }
      # tauri-action points the updater at api.github.com asset URLs, which share the anonymous
      # rate limit of the user's IP; the tag's download URLs don't.
      - name: Point latest.json at the release's download URLs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download $env:GITHUB_REF_NAME --pattern latest.json --dir updater --clobber
          if ($LASTEXITCODE -ne 0) { throw 'latest.json download failed.' }
          $assets = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets' | ConvertFrom-Json
          $json = Get-Content updater/latest.json -Raw | ConvertFrom-Json
          foreach ($platform in $json.platforms.PSObject.Properties) {
            $asset = @($assets | Where-Object apiUrl -eq $platform.Value.url)
            if ($asset.Count -ne 1) { throw "No release asset for $($platform.Name)'s URL $($platform.Value.url)." }
            $platform.Value.url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$([uri]::EscapeDataString($asset[0].name))"
          }
          [IO.File]::WriteAllText("$PWD/updater/latest.json", ($json | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))
          gh release upload $env:GITHUB_REF_NAME updater/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'latest.json upload failed.' }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false --latest
