name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # A patch to a dependency is code we maintain by hand at every upgrade.
      - name: Use dependencies as published
        run: |
          $patches = @(
            if (Select-String -Path src-tauri/Cargo.toml -Pattern '^\s*\[patch[.\]]' -Quiet) { 'a [patch] table in src-tauri/Cargo.toml' }
            if (Test-Path src-tauri/vendor) { 'src-tauri/vendor/' }
            if (Test-Path patches) { 'patches/' }
            if ((Get-Content package.json -Raw | ConvertFrom-Json).pnpm.patchedDependencies) { 'pnpm.patchedDependencies in package.json' }
          )
          if ($patches) { throw "Found $($patches -join ', '). Use the published dependency, or record an exception in an ADR and in this check." }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:provider

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm notices
        working-directory: .
      # The app embeds the built front end, which lint and tests don't need; an empty folder satisfies the build.
      - run: New-Item -ItemType Directory -Force ../dist
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
